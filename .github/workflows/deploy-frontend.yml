name: Deploy Frontend (PWA)

on:
  push:
    branches: [main]
    paths: ["footbail-pwa/**"]
  pull_request:
    branches: [main]
    paths: ["footbail-pwa/**"]

jobs:
  lint-and-test:
    name: ESLint, TypeScript & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footbail-pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: footbail-pwa/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Vitest
        run: npm test

  build-and-deploy:
    name: Build PWA & Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: footbail-pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: footbail-pwa/package-lock.json

      - run: npm ci

      - name: Build production PWA
        env:
          VITE_API_URL: https://api.footbail.in
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "manifest.json" \
            --exclude "sw.js"
          # HTML + manifest + SW — no-cache for instant updates
          aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "manifest.json" \
            --include "sw.js" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
