name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ["footbail-backend/**"]
  pull_request:
    branches: [main]
    paths: ["footbail-backend/**"]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footbail-backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: footbail_test
          POSTGRES_USER: footbail
          POSTGRES_PASSWORD: footbail
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: footbail-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://footbail:footbail@localhost:5432/footbail_test
          REDIS_URL: redis://localhost:6379/0
          LOCAL_DEV: "true"
          SECRET_KEY: ci-test-secret-key-minimum-32-chars
          DEV_OTP_BYPASS: "true"
          ENV: test
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/footbail-backend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/footbail-backend:latest \
                       footbail-backend/
          docker push $ECR_REGISTRY/footbail-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/footbail-backend:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster footbail-prod \
            --service footbail-api \
            --force-new-deployment \
            --region ap-south-1
