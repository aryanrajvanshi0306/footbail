version: "3.9"

# ─── footbAIl Local Dev Stack ─────────────────────────────────────────────────
# Services: FastAPI · Celery Worker · PostgreSQL · Redis · LocalStack · Vite PWA
#
# Quick start:
#   cp footbail-backend/.env.example footbail-backend/.env
#   cp footbail-pwa/.env.example     footbail-pwa/.env
#   docker compose up --build
#   open http://localhost:5173    ← PWA
#   open http://localhost:8000/docs ← Swagger UI
#   open http://localhost:8080    ← Adminer DB UI

x-backend-env: &backend-env
  ENV: development
  LOCAL_DEV: "true"
  DATABASE_URL: postgresql+asyncpg://footbail:footbail@postgres:5432/footbail
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: local-dev-secret-change-in-prod-32chars
  DEV_OTP_BYPASS: "true"
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  RAW_VIDEO_BUCKET: footbail-raw-videos
  PROCESSED_VIDEO_BUCKET: footbail-processed-videos
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000","https://app.footbail.in"]'

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: footbail_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: footbail
      POSTGRES_USER: footbail
      POSTGRES_PASSWORD: footbail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footbail -d footbail"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: footbail_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── LocalStack (AWS mock: S3, SQS, DynamoDB, Cognito) ────────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: footbail_localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb,iot,events
      DEBUG: "0"
      PERSISTENCE: "1"
      LOCALSTACK_VOLUME_DIR: /var/lib/localstack
    volumes:
      - localstack_data:/var/lib/localstack
      - ./footbail-backend/localstack/init-scripts:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./footbail-backend
      dockerfile: Dockerfile
    container_name: footbail_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    env_file:
      - ./footbail-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./footbail-backend:/app
      - uploaded_videos:/app/local_storage
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info"

  # ── Celery Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./footbail-backend
      dockerfile: Dockerfile
    container_name: footbail_worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    env_file:
      - ./footbail-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./footbail-backend:/app
      - uploaded_videos:/app/local_storage
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ── Vite PWA Dev Server ──────────────────────────────────────────────────────
  pwa:
    image: node:22-alpine
    container_name: footbail_pwa
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./footbail-pwa:/app
      - pwa_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  # ── Adminer (DB UI — dev only) ───────────────────────────────────────────────
  adminer:
    image: adminer:4-standalone
    container_name: footbail_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    profiles: ["dev"]

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  uploaded_videos:
  pwa_node_modules:
